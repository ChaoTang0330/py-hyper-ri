[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyHyperRI"
version = "1.0.0"
description = "Python package for hyperspectral radio interferometric imaging in astronomy."
readme = "README.md"
authors = [
    { name = "Chao Tang" },
    { name = "Adrian Jackson" },
]
requires-python = ">=3.11"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
dependencies = [
    "numpy>=2.3.5",
    "h5py>=3.15.1",
    "scipy>=1.17.0",
    "astropy>=7.2.0",
    "torch>=2.10.0",
    "onnx2torch>=1.5.15",
    "ptwt>=1.0.1",
    "scikit-image>=0.26.0",
    "torchkbnufft>=1.5.2",
    "pytorch-finufft>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/ChaoTang0330/py-hyper-ri"
Documentation = "https://chaotang0330.github.io/py-hyper-ri/"
Source = "https://github.com/ChaoTang0330/py-hyper-ri"
Tracker = "https://github.com/ChaoTang0330/py-hyper-ri/issues"

[project.optional-dependencies]
cuda = [
    "cufinufft>=2.2.0",
]
ms = [
    "python-casacore>=3.6.0",
]
notebook = [
    "ipykernel",
    "jupyterlab",
    "matplotlib",
]
dev = [
    "pytest>=7.0",
    "black",
    "ruff",
    "build",
    "twine",
]
docs = [
    "sphinx==7.2.6",
    "pytorch-sphinx-theme2==0.4.9",
    "sphinxcontrib-katex==0.9.11",
    "sphinx-copybutton==0.5.0",
    "sphinx-design==0.6.1",
    "myst-parser==4.0.1",
    "myst-nb==1.3.0",
]
all = [
    "cufinufft>=2.2.0",
    "python-casacore>=3.6.0",
    "ipykernel",
    "jupyterlab",
    "matplotlib",
    "pytest>=7.0",
    "black",
    "ruff",
    "build",
    "twine",
    "sphinx==7.2.6",
    "pytorch-sphinx-theme2==0.4.9",
    "sphinxcontrib-katex==0.9.11",
    "sphinx-copybutton==0.5.0",
    "sphinx-design==0.6.1",
    "myst-parser==4.0.1",
    "myst-nb==1.3.0",
]

[tool.setuptools.package-data]
hyri = [
    "airi_denoisers/*.csv",
    "airi_denoisers/**/*.onnx",
    "config/*.json",
]

[project.scripts]
hyri = "hyri.cli:run_hyri"
hyri-imaging = "hyri.cli:run_imager"
hyri-config = "hyri.cli:run_config"
hyri-ms2mat = "hyri.cli:run_ms2mat"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "test"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = []

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["test"]
python_files = ["test_*.py"]
addopts = "-ra"
pythonpath = ["src"]
filterwarnings = [
    'ignore:.*torch\.jit\.script.*deprecated.*:DeprecationWarning:torch\.jit\._script',
]
