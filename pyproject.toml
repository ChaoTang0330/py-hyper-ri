[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyHyperRI"
version = "1.0.0"
description = "Python package for hyperspectral radio interferometric imaging in astronomy."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "numpy>=2.3.5",
    "h5py>=3.15.1",
    "scipy>=1.17.0",
    "astropy>=7.2.0",
    "torch>=2.10.0",
    "onnx2torch>=1.5.15",
    "ptwt>=1.0.1",
    "scikit-image>=0.26.0",
    "torchkbnufft>=1.5.2",
    "pytorch-finufft>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black",
    "ruff",
    "build",
    "twine",
]
notebook = [
    "ipykernel",
]
cuda = [
    "cufinufft>=2.2.0",
]
ms = [
    "python-casacore",
]

[project.scripts]
hyri-imaging = "hyri.cli:run_imager"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "test"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = []

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["test"]
python_files = ["test_*.py", "*_test.py"]
addopts = "-ra"
pythonpath = ["src"]
filterwarnings = [
    'ignore:.*torch\.jit\.script.*deprecated.*:DeprecationWarning:torch\.jit\._script',
]
